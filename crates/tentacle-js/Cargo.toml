[package]
name = "tentacle-js"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tentacle-core = { path = "../tentacle-core" }
thiserror = "1"
rquickjs = { version = "0.5", optional = true }

[features]
# 默认不启用 rquickjs（编译时间长，保持 workspace 轻量）
# 需要 JS 沙箱时显式启用：cargo build -p tentacle-js --features runtime
default = []
runtime = ["dep:rquickjs"]
