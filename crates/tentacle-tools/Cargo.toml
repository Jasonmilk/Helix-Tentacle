[package]
name = "tentacle-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tentacle-core = { path = "../tentacle-core" }
tentacle-http = { path = "../tentacle-http", optional = true }
tentacle-wasm = { path = "../tentacle-wasm", optional = true, features = ["runtime"] }
tentacle-js = { path = "../tentacle-js", optional = true, features = ["runtime"] }
bloomfilter = { version = "1", optional = true }
serde_json = "1"
regex = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread"], optional = true }

[features]
default = []
# 已见熵布隆过滤器（四修正2，本地 bloomfilter crate）
# 默认不启用，保持 core 轻量；启用后 forager 可接收全局已见熵指纹
bloom = ["dep:bloomfilter"]
# WASM 工具执行（包装 tentacle-wasm 沙箱）
wasm = ["dep:tentacle-wasm"]
# JS 工具执行（包装 tentacle-js 沙箱）
js = ["dep:tentacle-js"]
# 完整工具执行（WASM + JS）
runtime = ["wasm", "js"]
# 定向爬取工具（HTTP 客户端 + 渐进式觅食 + HTML 解析）
scraper = ["dep:tentacle-http", "dep:regex", "dep:tokio"]

[dev-dependencies]
tempfile = "3"
