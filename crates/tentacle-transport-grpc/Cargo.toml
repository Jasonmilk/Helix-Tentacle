[package]
name = "tentacle-transport-grpc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tentacle-core = { path = "../tentacle-core" }
tonic = "0.12"
prost = "0.13"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
