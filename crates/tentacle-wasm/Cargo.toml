[package]
name = "tentacle-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tentacle-core = { path = "../tentacle-core" }
thiserror = "1"
wasmtime = { version = "26", optional = true }
wasmtime-wasi = { version = "26", optional = true }
bytes = { version = "1", optional = true }

[features]
# 默认不启用 wasmtime（编译时间长，保持 workspace 轻量）
# 需要 WASM 沙箱时显式启用：cargo build -p tentacle-wasm --features runtime
default = []
runtime = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:bytes"]
