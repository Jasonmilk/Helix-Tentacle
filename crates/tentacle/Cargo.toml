[package]
name = "tentacle"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tentacle"
path = "src/main.rs"

[dependencies]
tentacle-core = { path = "../tentacle-core" }
tentacle-transport-http = { path = "../tentacle-transport-http" }
tentacle-transport-grpc = { path = "../tentacle-transport-grpc" }
tonic = "0.12"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
axum = "0.7"
